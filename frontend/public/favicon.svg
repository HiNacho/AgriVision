<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gradient for the outer ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" /> <!-- Orange -->
      <stop offset="50%" stop-color="#eab308" /> <!-- Yellow -->
      <stop offset="100%" stop-color="#10b981" /> <!-- Green/Emerald -->
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="50" fill="#f5f5f4" stroke="url(#ringGrad)" stroke-width="5" />

  <!-- Inner Abstract Leaf Outline -->
  <path d="M58 28 C46 36 38 46 41 62 C43 78 52 90 60 93 C68 90 77 78 79 62 C81 46 74 36 62 28 Z" 
        fill="none" stroke="#d6d3d1" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Neural Network Branches (Teal lines) -->
  <!-- Left branch -->
  <path d="M49 52 Q53 62 48 73" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" />
  <!-- Center branch -->
  <path d="M66 38 L60 52 L65 67 L60 83" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right branch -->
  <path d="M75 52 L70 61 L74 72" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Nodes (Orange/Yellow small circles) -->
  <!-- Left nodes -->
  <circle cx="49" cy="52" r="3" fill="#f97316" stroke="#f5f5f4" stroke-width="0.8" />
  <circle cx="51" cy="62" r="3" fill="#eab308" stroke="#f5f5f4" stroke-width="0.8" />
  <circle cx="48" cy="73" r="3" fill="#f97316" stroke="#f5f5f4" stroke-width="0.8" />
  
  <!-- Center nodes -->
  <circle cx="66" cy="38" r="3" fill="#f97316" stroke="#f5f5f4" stroke-width="0.8" />
  <circle cx="60" cy="52" r="3.5" fill="#f97316" stroke="#f5f5f4" stroke-width="0.8" />
  <circle cx="65" cy="67" r="3.5" fill="#f97316" stroke="#f5f5f4" stroke-width="0.8" />
  <circle cx="60" cy="83" r="3" fill="#f97316" stroke="#f5f5f4" stroke-width="0.8" />

  <!-- Right nodes -->
  <circle cx="75" cy="52" r="3" fill="#eab308" stroke="#f5f5f4" stroke-width="0.8" />
  <circle cx="70" cy="61" r="3" fill="#f97316" stroke="#f5f5f4" stroke-width="0.8" />
  <circle cx="74" cy="72" r="3" fill="#eab308" stroke="#f5f5f4" stroke-width="0.8" />
</svg>